version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: cupim-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=cupim_telha
    networks:
      - cupim-network

  # Backend (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cupim-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=cupim_telha
      - CORS_ORIGINS=*
      - JWT_SECRET=${JWT_SECRET:-cupim-na-telha-dev-secret-change-me}
    networks:
      - cupim-network

  # Frontend (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cupim-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cupim-network

networks:
  cupim-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
